services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${DB_NAME:-cod_report}
      MARIADB_USER: ${DB_USER:-cod_report_app}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: .
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      PORT: 19080
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-cod_report_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-cod_report}
      DATASOURCE_SECRET: ${DATASOURCE_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
    ports:
      # 기본은 이 PC에서만 접속. 사내망의 다른 PC에서 접속하려면 .env에 API_BIND_ADDRESS=0.0.0.0 설정
      - "${API_BIND_ADDRESS:-127.0.0.1}:19080:19080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:19080/api/auth/status').then(r=>r.json()).then(s=>process.exit(typeof s.setupRequired==='boolean'?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb_data:
